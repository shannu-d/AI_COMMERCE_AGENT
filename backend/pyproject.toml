[project]
name = "ai-commerce-backend"
version = "0.1.0"
description = "Merchant AI Commerce Agent — backend (catalog foundation)"
requires-python = ">=3.12"

# The stack is fixed by architecture.md D§38 and L§44:
# PostgreSQL, FastAPI, SQLAlchemy, Alembic, psycopg, Pydantic.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "requires_db: needs a reachable PostgreSQL instance (TEST_DATABASE_URL). Skipped, never silently passed, when none is available.",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # naming
    "RUF",
]
ignore = [
    "B008",    # FastAPI Depends() in defaults is the framework's idiom
    "RUF002",  # docstrings quote architecture.md, which uses en dashes and section signs
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
